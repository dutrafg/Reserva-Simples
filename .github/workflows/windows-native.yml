name: Reserva Simples Windows
on:
  workflow_dispatch:
  push:
    branches: [windows-native]
    paths: ['windows/**', '.github/workflows/windows-native.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publicar Windows x64
        run: dotnet publish windows/ReservaSimples.csproj -c Release -r win-x64 --self-contained true -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Reserva-Simples-Windows-x64
          path: artifacts/win-x64/
          if-no-files-found: error
      - name: Compilar instalador x64
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc windows/installer/ReservaSimples.iss
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Reserva-Simples-Instalador-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
