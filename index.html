/* Refinamentos v0.3: controles de edição e cópia de despesas */
.table-actions{display:flex;gap:7px;justify-content:flex-end;align-items:center}
.table-actions button{font-size:12px;white-space:nowrap;font-weight:700;border-radius:8px;padding:8px 9px;border:1px solid var(--line);background:var(--card)}
.table-actions .edit{color:var(--green)}
.table-actions .delete{color:var(--danger)}
.help{margin:15px 0 0;color:var(--muted);font-size:12px;line-height:1.65}
@media(max-width:760px){.table-actions{flex-direction:column;align-items:stretch}.table-actions button{font-size:11px;padding:6px}.section-heading>.actions{display:flex;flex-wrap:wrap;justify-content:flex-start}}
@media(max-width:380px){.table-actions{gap:3px}.data-table th,.data-table td{padding-inline:6px}}
/* Motores locais v0.4: resultados simples, sem criar novos módulos. */
.plan-banner{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:21px 23px;background:var(--mint);border:1px solid var(--line);border-radius:17px}
.plan-banner .overline{display:block;font-size:10px;letter-spacing:.13em;font-weight:850;color:var(--good);margin-bottom:8px}
.plan-banner h3{font-size:18px;letter-spacing:-.35px;margin:0 0 7px}
.plan-banner p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
.goal-pacing{display:grid;gap:6px;padding:12px;border-radius:11px;background:var(--bg);color:var(--muted);font-size:11px;line-height:1.5}
.goal-pacing b{color:var(--ink)}
.goal-draft-preview{grid-column:1/-1;display:grid;gap:5px;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:var(--mint);font-size:12px;line-height:1.5;color:var(--muted)}
.goal-draft-preview b{font-size:15px;color:var(--ink)}
.prediction-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.prediction-grid>div{padding:15px 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.prediction-grid span{display:block;color:var(--muted);font-size:11px;line-height:1.4}
.prediction-grid strong{display:block;margin-top:10px;font-size:17px;overflow-wrap:anywhere}
.projection-target small{display:block;color:var(--muted);font-size:12px}
.projection-target strong{display:block;margin:12px 0;font-size:26px;letter-spacing:-1px}
.projection-target strong span{font-size:13px;color:var(--muted);letter-spacing:0}
.projection-target p{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 16px}
.soft-tip{padding:13px 16px;margin-top:17px;background:var(--mint);font-size:12px;line-height:1.6;color:var(--ink);border-radius:12px}
.insight.engine-critical{border-left:3px solid #d45b53}.insight.engine-attention{border-left:3px solid #e3a25c}.insight.engine-positive{border-left:3px solid #3d81dc}.insight.engine-info{border-left:3px solid #94a6c7}
@media(max-width:760px){.plan-banner{display:block;padding:19px}.plan-banner>.tag{margin-top:13px}.prediction-grid{grid-template-columns:1fr}.prediction-grid>div{padding:10px 13px}.prediction-grid strong{margin-top:4px;font-size:19px}}

/* v0.14 — Recuperação de dados, backups protegidos e mês atual. */
.simulator-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}

ap:12px;padding:11px 3px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left}.home-category-trend-row span{display:grid;gap:4px}.home-category-trend-row b{font-size:12px}.home-category-trend-row small{font-size:10px;color:var(--muted)}.home-category-trend-row strong{font-size:12px;white-space:nowrap}.home-category-trend-row .trend-up{color:var(--danger)}.home-category-trend-row .trend-down{color:var(--good)}.home-card-tools{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin-top:8px;padding-top:7px;border-top:1px solid color-mix(in srgb,var(--line) 65%,transparent)}.home-card-tools button{min-width:0;min-height:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px 1px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font-size:9px;font-weight:650}.home-card-tools button span{display:inline-flex;align-items:center;justify-content:center;min-height:16px}.home-card-tools button svg{width:14px;height:14px;color:var(--green)}.home-card-tools button small{display:block;max-width:100%;font-size:7.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.home-card-tools button:hover,.home-card-tools button:focus-visible{border-color:var(--line);background:var(--bg);color:var(--green)}.home-card-tools button:focus-visible{outline:2px solid var(--green);outline-offset:1px}@media(max-width:390px){.home-card-tools{gap:1px}.home-card-tools button{min-height:34px}.home-card-tools button small{font-size:7px}}.today-card{--primary:#17834c;--warning:#b7791f;overflow:visible;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 9px 28px rgba(20,41,72,.07)}.today-card:after{display:none}body.dark .today-card{background:var(--card);box-shadow:0 9px 28px rgba(0,0,0,.2)}.today-overline{color:var(--muted)}.today-overline:before{background:#18a558;box-shadow:0 0 0 4px rgba(24,165,88,.12)}.today-amount{color:var(--ink)}.today-amount.over-budget{color:var(--danger)}.today-card>p{color:var(--muted)}.budget-progress-track{background:var(--line)}.budget-progress-track span{background:#18a558}.budget-progress-caption{color:var(--muted)}.today-card .empty-inline{border-color:var(--line);background:var(--bg);color:var(--muted)}.today-income-expense{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:3px}.today-income-expense button{min-width:0;display:grid;gap:7px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);text-align:left;color:var(--ink)}.today-income-expense button span{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700}.today-income-expense button span svg{width:16px;height:16px;color:#17834c}.today-income-expense button:last-child span svg{color:var(--danger)}.today-income-expense button strong{font-size:clamp(16px,3vw,22px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.today-card h2{padding-right:34px}
@media(max-width:640px){.home-card-tools{gap:5px}.home-card-tools button{min-height:42px;font-size:9px}.home-category-layout{grid-template-columns:minmax(0,1fr);gap:12px}.home-category-donut{width:155px}.home-category-legend{gap:2px}.home-category-row{grid-template-columns:10px minmax(0,1fr) auto;gap:6px}.home-category-head h2{font-size:16px}.home-category-toggle button{width:34px;height:32px}}

.home-due-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0}.home-due-summary>div{display:grid;gap:4px;padding:9px;background:var(--bg);border:1px solid var(--line);border-radius:11px}.home-due-summary small{color:var(--muted);font-size:10px}.home-due-summary strong{font-size:16px;font-variant-numeric:tabular-nums}.home-due-summary>div:first-child strong{color:var(--danger)}

<style id="saved-ideas-styles">.home-forecast-card .forecast-row{padding:12px 0;border-bottom:1px solid var(--line,#dfe6ef)}.forecast-row>div:first-child{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.forecast-row>div:first-child span{font-weight:700;margin-right:auto}.forecast-row small{font-size:.78em;color:var(--muted,#6b7787);font-weight:500}.forecast-track{height:9px;border-radius:20px;background:var(--surface-2,#eaf0f7);position:relative;overflow:hidden}.forecast-track i,.forecast-track em{position:absolute;inset:0 auto 0 0;border-radius:20px}.forecast-track em{height:3px;top:3px;background:var(--text,#14314d);opacity:.75}.monthly-close-card #monthlyCloseChecklist{display:grid;gap:12px}.monthly-close-card label,.csv-reconcile{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line,#dfe6ef);border-radius:12px}.monthly-close-card input,.csv-reconcile input{width:20px;height:20px;accent-color:var(--primary,#1762c4)}.csv-category{max-width:160px;min-height:36px;border:1px solid var(--line,#dfe6ef);border-radius:8px;background:var(--surface,#fff);color:inherit;padding:4px}.csv-reconcile{margin:12px 0}.bank-csv-preview .help{display:block;font-size:.8em}.nav-short{white-space:nowrap}@media(max-width:600px){.forecast-row>div:first-child{gap:7px}.forecast-row>div:first-child span{flex-basis:100%}.csv-category{max-width:125px;font-size:.82rem}}
