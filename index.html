body.dark{color-scheme:dark;--bg:#0b1529;--card:#13243b;--ink:#eff5ff;--muted:#a2b4d3;--green:#8bbafd;--mint:#1e375a;--line:#334a6d;--shadow:0 10px 24px rgba(0,0,0,.06);--good:#87b6f8;--danger:#ea9790}body.dark .hero{background:linear-gradient(120deg,#0f2c63,#1556b5)}body.dark .hero-note{background:rgba(255,255,255,.08)}body.dark .callout p{color:#b7cff4}body.dark .stat svg{color:var(--good)}body.dark .brand-icon,body.dark .btn.primary{background:#2c6cce;color:#fff}body.dark .month-picker button{color:var(--green)}body.dark .field input,body.dark .field select{border-color:var(--line)}

/* Refinamentos v0.3: controles de edição e cópia de despesas */
.table-actions{display:flex;gap:7px;justify-content:flex-end;align-items:center}
.table-actions button{font-size:12px;white-space:nowrap;font-weight:700;border-radius:8px;padding:8px 9px;border:1px solid var(--line);background:var(--card)}
.table-actions .edit{color:var(--green)}
.table-actions .delete{color:var(--danger)}
.help{margin:15px 0 0;color:var(--muted);font-size:12px;line-height:1.65}
@media(max-width:760px){.table-actions{flex-direction:column;align-items:stretch}.table-actions button{font-size:11px;padding:6px}.section-heading>.actions{display:flex;flex-wrap:wrap;justify-content:flex-start}}
@media(max-width:380px){.table-actions{gap:3px}.data-table th,.data-table td{padding-inline:6px}}
/* Motores locais v0.4: resultados simples, sem criar novos módulos. */
.plan-banner{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:21px 23px;background:var(--mint);border:1px solid var(--line);border-radius:17px}
.plan-banner .overline{display:block;font-size:10px;letter-spacing:.13em;font-weight:850;color:var(--good);margin-bottom:8px}
.plan-banner h3{font-size:18px;letter-spacing:-.35px;margin:0 0 7px}
.plan-banner p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
.goal-pacing{display:grid;gap:6px;padding:12px;border-radius:11px;background:var(--bg);color:var(--muted);font-size:11px;line-height:1.5}
.goal-pacing b{color:var(--ink)}
.goal-draft-preview{grid-column:1/-1;display:grid;gap:5px;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:var(--mint);font-size:12px;line-height:1.5;color:var(--muted)}
.goal-draft-preview b{font-size:15px;color:var(--ink)}
.prediction-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.prediction-grid>div{padding:15px 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.prediction-grid span{display:block;color:var(--muted);font-size:11px;line-height:1.4}
.prediction-grid strong{display:block;margin-top:10px;font-size:17px;overflow-wrap:anywhere}
.projection-target small{display:block;color:var(--muted);font-size:12px}
.projection-target strong{display:block;margin:12px 0;font-size:26px;letter-spacing:-1px}
.projection-target strong span{font-size:13px;color:var(--muted);letter-spacing:0}
.projection-target p{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 16px}
.soft-tip{padding:13px 16px;margin-top:17px;background:var(--mint);font-size:12px;line-height:1.6;color:var(--ink);border-radius:12px}
.insight.engine-critical{border-left:3px solid #d45b53}.insight.engine-attention{border-left:3px solid #e3a25c}.insight.engine-positive{border-left:3px solid #3d81dc}.insight.engine-info{border-left:3px solid #94a6c7}
@media(max-width:760px){.plan-banner{display:block;padding:19px}.plan-banner>.tag{margin-top:13px}.prediction-grid{grid-template-columns:1fr}.prediction-grid>div{padding:10px 13px}.prediction-grid strong{margin-top:4px;font-size:19px}}

/* v0.14 — Recuperação de dados, backups protegidos e mês atual. */
.simulator-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.sim-result{background:var(--bg);border:1px solid var(--line);border-radius:13px;margin-top:14px;padding:16px}
.sim-result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sim-result-grid span{color:var(--muted);display:block;font-size:11px;line-height:1.5;min-height:30px}
.sim-result-grid strong{color:var(--ink);display:block;margin-top:7px;font-size:16px;overflow-wrap:anywhere}
.sim-result p{font-size:12px;line-height:1.6;margin:12px 0 0}
.sim-good{color:var(--green)}.sim-alert{color:var(--danger)}
@media(max-width:760px){.simulator-fields{grid-template-columns:1fr}.sim-result-grid{grid-template-columns:1fr;gap:8px}.sim-result-grid span{min-height:0}.sim-result-grid strong{margin-top:3px}.sim-result-grid>div{padding:8px 0;border-bottom:1px solid var(--line)}}

.brand-icon{background:linear-gradient(145deg,#256bd0,#123f8e);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 7px 18px rgba(17,67,145,.2);border:1px solid rgba(255,255,255,.16)}
.brand-icon svg{width:27px;height:27px;stroke:#fff;stroke-width:1.8}
.brand-icon svg circle{stroke-width:1.5}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
.settings-card{display:grid;align-content:start;gap:15px;padding:21px}
.settings-card-head{display:flex;align-items:flex-start;gap:11px}
.settings-card-head h2{margin:1px 0 0;font-size:16px;letter-spacing:-.25px}
.settings-card-head p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.55}
.settings-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--mint);color:var(--good)}
.settings-icon svg{width:18px;height:18px}
.settings-card .setting-row{padding:13px 0 0;border-bottom:0;border-top:1px solid var(--line);align-items:center}
.settings-card .setting-row h3{font-size:13px}
.settings-card .setting-row p{font-size:11px}
.setting-actions{display:flex;flex-wrap:wrap;gap:8px}
.settings-note,.privacy-status p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}
